<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script src="auth-guard.js"></script>
<script>
        // Variables for system state
        let currentProfile = null;
        let currentRows = [];
        let taggableUsers = [];
        const namaMeal = { pagi: 'Pagi', siang: 'Siang', malam: 'Malam' };
        const mealBadgeColor = {
            pagi: 'bg-amber-100 text-amber-700',
            siang: 'bg-sky-100 text-sky-700',
            malam: 'bg-indigo-100 text-indigo-700'
        };
        const namaProduk = { tahanan: 'Tahanan', anggota: 'Anggota', tahanan_propam: 'Tahanan Propam' };
        const mealOrder = { pagi: 0, siang: 1, malam: 2 };

        // Helper functions
        function todayStr() {
            const d = new Date();
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function showTab(tab) {
            ['monitoring', 'laporan', 'akun'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tab) {
                    el?.classList.remove('hidden');
                    btn?.classList.add('active-gold-border', 'font-bold');
                    btn?.classList.remove('text-on-surface-variant');
                    btn?.classList.add('text-primary-fixed-dim');
                } else {
                    el?.classList.add('hidden');
                    btn?.classList.remove('active-gold-border', 'font-bold');
                    btn?.classList.add('text-on-surface-variant');
                    btn?.classList.remove('text-primary-fixed-dim');
                }
            });
            if (tab === 'akun') loadUsers();
        }

        function showLaporanSubTab(sub) {
            ['harian', 'bulanan'].forEach(s => {
                const el = document.getElementById(`subtab-${s}`);
                const btn = document.getElementById(`subtab-btn-${s}`);
                if (s === sub) {
                    el?.classList.remove('hidden');
                    btn?.classList.add('active', 'border-sm-gold', 'bg-surface-container-low');
                } else {
                    el?.classList.add('hidden');
                    btn?.classList.remove('active', 'border-sm-gold', 'bg-surface-container-low');
                }
            });
        }

        function computeStatusSiklus(row) {
            if (!row.log_id) return { key: 'belum_produksi', label: 'Belum Produksi', cls: 'bg-surface-container-highest text-outline' };
            const sudahDikirim = row.qty_received !== null;
            if (row.status === 'approved') return { key: 'selesai', label: 'Selesai', cls: 'bg-done-bg text-done-text border border-done-text/20' };
            if (sudahDikirim && row.qty_received < row.qty_produced) return { key: 'sebagian', label: 'Terkirim Sebagian', cls: 'bg-orange-100 text-orange-700 border border-orange-200' };
            if (sudahDikirim) return { key: 'terkirim', label: 'Terkirim', cls: 'bg-secondary-container text-on-secondary-container' };
            return { key: 'siap_kirim', label: 'Siap Kirim', cls: 'bg-sm-gold/20 text-secondary-fixed-dim border border-sm-gold' };
        }

        async function loadData() {
            const tanggal = document.getElementById('date-picker').value;
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '<tr><td colspan="13" class="p-12 text-center text-outline-variant"><div class="flex flex-col items-center gap-4"><div class="w-12 h-12 border-4 border-sm-blue border-t-transparent rounded-full animate-spin"></div><span class="font-headline-md text-primary">Memuat data operasional...</span></div></td></tr>';

            const { data: lp, error: lpErr } = await supabaseClient.from('location_products').select('location_id, product_type, meal_time, locations(nama)').order('location_id');
            const { data: pl, error: plErr } = await supabaseClient.from('production_logs').select('id, location_id, product_type, meal_time, qty_produced, status, catatan_admin, catatan_tag_user_id, tagged_user:users!catatan_tag_user_id(nama), users!input_by(nama), approved_user:users!approved_by(nama)').eq('tanggal', tanggal);

            if (lpErr || plErr) {
                tableBody.innerHTML = '<tr><td colspan="13" class="p-10 text-center text-error">Gagal memuat data dari database. Silahkan refresh.</td></tr>';
                return;
            }

            const logIds = pl.map(p => p.id);
            let dl = [];
            if (logIds.length > 0) {
                const { data: dls } = await supabaseClient.from('delivery_logs').select('production_log_id, qty_received, retur, photo_url, gps_lat, gps_lng, receiver_name, timestamp, users!submitted_by(nama)').in('production_log_id', logIds).order('timestamp', { ascending: true });
                dl = dls || [];
            }

            currentRows = lp.map(item => {
                const prod = pl.find(p => p.location_id === item.location_id && p.product_type === item.product_type && p.meal_time === item.meal_time);
                const deliveries = prod ? dl.filter(d => d.production_log_id === prod.id) : [];
                const lastDelivery = deliveries.length > 0 ? deliveries[deliveries.length - 1] : null;
                const namaKurirList = [...new Set(deliveries.map(d => d.users?.nama).filter(Boolean))];
                return {
                    location_nama: item.locations.nama,
                    product_type: item.product_type,
                    meal_time: item.meal_time,
                    log_id: prod ? prod.id : null,
                    qty_produced: prod ? prod.qty_produced : null,
                    status: prod ? prod.status : null,
                    catatan_admin: prod ? prod.catatan_admin : null,
                    catatan_tag_user_id: prod ? prod.catatan_tag_user_id : null,
                    catatan_tag_nama: prod?.tagged_user?.nama,
                    input_by_nama: prod?.users?.nama,
                    approved_by_nama: prod?.approved_user?.nama,
                    delivered_by_nama: namaKurirList.length > 0 ? namaKurirList.join(', ') : null,
                    qty_received: deliveries.length > 0 ? deliveries.reduce((sum, d) => sum + d.qty_received, 0) : null,
                    retur: deliveries.length > 0 ? deliveries.reduce((sum, d) => sum + (d.retur || 0), 0) : null,
                    jumlah_kunjungan: deliveries.length,
                    receiver_name: lastDelivery ? lastDelivery.receiver_name : null,
                    photo_url: lastDelivery ? lastDelivery.photo_url : null,
                    gps_lat: lastDelivery ? lastDelivery.gps_lat : null,
                    gps_lng: lastDelivery ? lastDelivery.gps_lng : null
                };
            });

            currentRows.sort((a, b) => a.location_nama.localeCompare(b.location_nama) || a.product_type.localeCompare(b.product_type) || mealOrder[a.meal_time] - mealOrder[b.meal_time]);
            renderTable();
        }

        function renderTable() {
            const fLokasi = document.getElementById('filter-lokasi').value;
            const fProduk = document.getElementById('filter-produk').value;
            const fMeal = document.getElementById('filter-meal').value;
            const fStatus = document.getElementById('filter-status').value;

            const filtered = currentRows.filter(r => {
                if (fLokasi && r.location_nama !== fLokasi) return false;
                if (fProduk && r.product_type !== fProduk) return false;
                if (fMeal && r.meal_time !== fMeal) return false;
                if (fStatus && computeStatusSiklus(r).key !== fStatus) return false;
                return true;
            });

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="13" class="p-10 text-center text-outline">Tidak ada data operasional yang sesuai dengan filter.</td></tr>';
                updateApproveButton();
                return;
            }

            filtered.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-surface-container-low transition-colors group";
                const siklus = computeStatusSiklus(row);

                const qtyDisplay = row.log_id 
                    ? `<div class="flex items-center gap-2" id="qtycell-${row.log_id}">
                         <span class="font-bold text-primary">${row.qty_produced}</span>
                         ${currentProfile.role !== 'direksi' ? `<button onclick="enableEditQty('${row.log_id}', ${row.qty_produced})" class="opacity-0 group-hover:opacity-100 material-symbols-outlined text-xs p-1 rounded hover:bg-surface-container-high transition-all">edit</button>` : ''}
                       </div>`
                    : '<span class="text-outline-variant">—</span>';

                const catatanTooltip = row.catatan_admin
                    ? (row.catatan_tag_nama ? `Catatan buat ${row.catatan_tag_nama}` : 'Ada catatan')
                    : 'Tambah catatan';
                const catatanIcon = row.log_id
                    ? `<button onclick="openCatatan('${row.log_id}', this)" class="p-2 rounded-full border transition-all ${row.catatan_admin ? 'bg-orange-100 border-orange-300 text-orange-600' : 'bg-surface-container border-outline-variant text-outline hover:bg-orange-50 hover:text-orange-500'}" title="${catatanTooltip}"><span class="material-symbols-outlined text-sm">${row.catatan_admin ? 'sticky_note_2' : 'note_add'}</span></button>`
                    : '';

                const mediaActions = (row.photo_url || catatanIcon)
                    ? `<div class="flex gap-2 items-center">
                        ${row.photo_url ? `<a href="${row.photo_url}" target="_blank" class="p-2 rounded-full bg-surface-container border border-outline-variant hover:bg-sm-gold/10 hover:text-sm-gold transition-all" title="Lihat Foto"><span class="material-symbols-outlined text-sm">image</span></a>` : ''}
                        ${row.photo_url ? `<a href="https://www.google.com/maps?q=${row.gps_lat},${row.gps_lng}" target="_blank" class="p-2 rounded-full bg-surface-container border border-outline-variant hover:bg-primary/10 hover:text-primary transition-all" title="Buka GPS"><span class="material-symbols-outlined text-sm">location_on</span></a>` : ''}
                        ${catatanIcon}
                       </div>`
                    : '<span class="text-outline-variant">—</span>';

                const rowAction = (currentProfile.role === 'direksi')
                    ? `<span class="text-outline-variant text-[10px] uppercase font-bold tracking-tighter">Lihat Saja</span>`
                    : (siklus.key === 'terkirim')
                    ? `<div class="flex items-center gap-3">
                        <input type="checkbox" class="approve-checkbox w-4 h-4 rounded border-outline-variant text-sm-gold focus:ring-sm-gold" data-log-id="${row.log_id}" onchange="updateApproveButton()">
                        <button onclick="approveSingle('${row.log_id}')" class="bg-sm-gold text-on-secondary px-3 py-1 rounded text-xs font-bold hover:brightness-110 transition-all">Approve</button>
                       </div>`
                    : `<span class="text-outline-variant text-[10px] uppercase font-bold tracking-tighter">Dikunci</span>`;

                tr.innerHTML = `
                    <td class="p-4 font-bold text-primary table-sticky-col">${row.location_nama}</td>
                    <td class="p-4">${namaProduk[row.product_type]}</td>
                    <td class="p-4"><span class="px-2 py-1 rounded text-xs uppercase font-bold ${mealBadgeColor[row.meal_time]}">${namaMeal[row.meal_time]}</span></td>
                    <td class="p-4">${qtyDisplay}</td>
                    <td class="p-4"><span class="badge px-3 py-1 rounded-full font-bold text-[10px] uppercase tracking-wide shadow-sm ${siklus.cls}">${siklus.label}</span></td>
                    <td class="p-4 text-xs font-medium">${row.input_by_nama || '—'}</td>
                    <td class="p-4 text-xs font-medium">${row.approved_by_nama || '—'}</td>
                    <td class="p-4 text-xs font-medium">${row.delivered_by_nama || '—'}</td>
                    <td class="p-4 font-bold">${row.qty_received ?? '—'}${row.jumlah_kunjungan > 1 ? `<span class="ml-1 text-[9px] font-bold text-sm-gold align-top">×${row.jumlah_kunjungan}</span>` : ''}</td>
                    <td class="p-4"><span class="${row.retur > 0 ? 'text-error font-bold' : 'text-outline-variant'}">${row.retur ?? '—'}</span></td>
                    <td class="p-4 text-xs italic">${row.receiver_name || '—'}</td>
                    <td class="p-4">${mediaActions}</td>
                    <td class="p-4">${rowAction}</td>
                `;
                tbody.appendChild(tr);
            });
            updateApproveButton();
        }

        function closePopup() { document.getElementById('popup-overlay').classList.add('hidden'); }

        let activeCatatanLogId = null;

        function openCatatan(logId, btnEl) {
            const popover = document.getElementById('catatan-popover');
            const textarea = document.getElementById('catatan-textarea');
            const tagSelect = document.getElementById('catatan-tag-select');
            const saveBtn = document.getElementById('btn-save-catatan');

            // Kalau popover yang sama masih kebuka, klik lagi = tutup (toggle)
            if (!popover.classList.contains('hidden') && activeCatatanLogId === logId) {
                closeCatatanPopover();
                return;
            }

            activeCatatanLogId = logId;
            const row = currentRows.find(r => r.log_id === logId);
            textarea.value = (row && row.catatan_admin) ? row.catatan_admin : '';

            tagSelect.innerHTML = '<option value="">— Tidak ditag —</option>' +
                taggableUsers.map(u => `<option value="${u.id}">${u.nama}</option>`).join('');
            tagSelect.value = (row && row.catatan_tag_user_id) ? row.catatan_tag_user_id : '';

            const isDireksi = currentProfile.role === 'direksi';
            textarea.readOnly = isDireksi;
            tagSelect.disabled = isDireksi;
            saveBtn.classList.toggle('hidden', isDireksi);

            popover.classList.remove('hidden');

            // Posisiin nempel di bawah tombol yang diklik, geser ke kiri kalau kepotong layar
            const rect = btnEl.getBoundingClientRect();
            const popW = 256; // w-64
            let left = rect.left;
            if (left + popW > window.innerWidth - 16) left = window.innerWidth - popW - 16;
            let top = rect.bottom + 8;
            popover.style.left = left + 'px';
            popover.style.top = top + 'px';

            // Kalau ketutup tepi bawah layar, tampilin di ATAS tombol sebagai gantinya
            requestAnimationFrame(() => {
                const popRect = popover.getBoundingClientRect();
                if (popRect.bottom > window.innerHeight - 16) {
                    popover.style.top = (rect.top - popRect.height - 8) + 'px';
                }
            });

            if (!isDireksi) textarea.focus();
        }

        function closeCatatanPopover() {
            document.getElementById('catatan-popover').classList.add('hidden');
            activeCatatanLogId = null;
        }

        async function saveCatatan() {
            if (!activeCatatanLogId) return;
            const text = document.getElementById('catatan-textarea').value.trim();
            const tagUserId = document.getElementById('catatan-tag-select').value;
            const saveBtn = document.getElementById('btn-save-catatan');
            const originalText = saveBtn.textContent;
            saveBtn.textContent = '...';
            saveBtn.disabled = true;

            const { error } = await supabaseClient
                .from('production_logs')
                .update({ catatan_admin: text || null, catatan_tag_user_id: tagUserId || null })
                .eq('id', activeCatatanLogId);

            saveBtn.textContent = originalText;
            saveBtn.disabled = false;

            if (error) {
                alert('Gagal menyimpan catatan: ' + error.message);
                return;
            }

            const row = currentRows.find(r => r.log_id === activeCatatanLogId);
            if (row) {
                row.catatan_admin = text || null;
                row.catatan_tag_user_id = tagUserId || null;
                const taggedUser = taggableUsers.find(u => u.id === tagUserId);
                row.catatan_tag_nama = taggedUser ? taggedUser.nama : null;
            }
            closeCatatanPopover();
            renderTable();
        }

        document.addEventListener('click', function (e) {
            const popover = document.getElementById('catatan-popover');
            if (popover.classList.contains('hidden')) return;
            if (popover.contains(e.target)) return;
            if (e.target.closest('[onclick^="openCatatan"]')) return;
            closeCatatanPopover();
        });

        function formatTanggalIndo(dateStr) {
            const bulanIndo = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            const [y, m, d] = dateStr.split('-').map(Number);
            return `${d} ${bulanIndo[m - 1]} ${y}`;
        }

        function formatHariTanggalIndo(dateStr) {
            const hariIndo = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
            const [y, m, d] = dateStr.split('-').map(Number);
            const dateObj = new Date(y, m - 1, d);
            return `${hariIndo[dateObj.getDay()]}, ${formatTanggalIndo(dateStr)}`;
        }

        function formatWaktuSekarangLengkap() {
            const now = new Date();
            const jam = String(now.getHours()).padStart(2, '0');
            const menit = String(now.getMinutes()).padStart(2, '0');
            return `${formatTanggalIndo(todayStr())}, ${jam}.${menit} WIB`;
        }

        async function generateLaporanHarian() {
            const tanggal = document.getElementById('date-picker-laporan').value;
            const output = document.getElementById('laporan-output');
            const statusLine = document.getElementById('status-line-laporan');
            statusLine.innerText = "Menyusun rekap harian...";
            output.value = '';

            const { data: lp, error: lpErr } = await supabaseClient
                .from('location_products')
                .select('location_id, product_type, meal_time, default_qty, locations(nama, routes(nama, is_mitra))')
                .order('location_id');

            const { data: pl, error: plErr } = await supabaseClient
                .from('production_logs')
                .select('id, location_id, product_type, meal_time, qty_produced, status, catatan_admin, tagged_user:users!catatan_tag_user_id(nama), users!input_by(nama), approved_user:users!approved_by(nama)')
                .eq('tanggal', tanggal);

            if (lpErr || plErr) {
                statusLine.innerText = "Gagal memuat data: " + (lpErr ? lpErr.message : plErr.message);
                return;
            }

            const logIds = pl.map(p => p.id);
            let dl = [];
            if (logIds.length > 0) {
                const { data: dls } = await supabaseClient
                    .from('delivery_logs')
                    .select('production_log_id, qty_received, retur, submitted_user:users!submitted_by(nama)')
                    .in('production_log_id', logIds);
                dl = dls || [];
            }

            const rows = lp.map(item => {
                const prod = pl.find(p => p.location_id === item.location_id && p.product_type === item.product_type && p.meal_time === item.meal_time);
                const deliveries = prod ? dl.filter(d => d.production_log_id === prod.id) : [];
                const route = item.locations.routes;
                return {
                    location_nama: item.locations.nama,
                    route_nama: route ? route.nama : '—',
                    is_mitra: route ? route.is_mitra : false,
                    product_type: item.product_type,
                    meal_time: item.meal_time,
                    default_qty: item.default_qty,
                    qty_produced: prod ? prod.qty_produced : null,
                    status: prod ? prod.status : null,
                    catatan_admin: prod ? prod.catatan_admin : null,
                    catatan_tag_nama: prod?.tagged_user?.nama,
                    input_by_nama: prod?.users?.nama,
                    approved_by_nama: prod?.approved_user?.nama,
                    qty_received: deliveries.length > 0 ? deliveries.reduce((sum, d) => sum + d.qty_received, 0) : null,
                    retur: deliveries.length > 0 ? deliveries.reduce((sum, d) => sum + (d.retur || 0), 0) : null,
                    delivered_by_list: [...new Set(deliveries.map(d => d.submitted_user?.nama).filter(Boolean))]
                };
            });

            const isSelesai = r => r.qty_produced !== null && r.qty_received !== null && r.qty_received >= r.qty_produced;
            const hitungSelesai = list => list.filter(isSelesai).length;
            const hitungRetur = list => list.reduce((sum, r) => sum + (r.retur || 0), 0);
            const labelProdukJadwal = r => `${namaProduk[r.product_type]} ${namaMeal[r.meal_time]}`;

            const totalItem = rows.length;
            const sudahProduksi = rows.filter(r => r.qty_produced !== null).length;
            const sudahKirim = rows.filter(r => r.qty_received !== null).length;
            const sudahApprove = rows.filter(r => r.status === 'approved').length;

            // ===== 1. Header =====
            let text = `📋 *LAPORAN HARIAN — SM CATERING*\n`;
            text += `*${formatHariTanggalIndo(tanggal)}*\n`;

            // ===== 2. Total Pengiriman (produksi vs terkirim, per produk+jadwal, dipisah Internal/Mitra) =====
            const urutanProdukTampilan = ['anggota', 'tahanan', 'tahanan_propam'];
            const namaProdukTampilan = { anggota: 'Makan Anggota', tahanan: 'Makan Tahanan', tahanan_propam: 'Makan Tahanan PROPAM' };

            function tulisTotalPengiriman(list) {
                const byProdukJadwal = {};
                list.forEach(r => {
                    const key = `${r.product_type}|${r.meal_time}`;
                    if (!byProdukJadwal[key]) {
                        byProdukJadwal[key] = { product_type: r.product_type, meal_time: r.meal_time, produksi: 0, terkirim: 0 };
                    }
                    if (r.qty_produced !== null) byProdukJadwal[key].produksi += r.qty_produced;
                    if (r.qty_received !== null) byProdukJadwal[key].terkirim += r.qty_received;
                });
                urutanProdukTampilan.forEach(pt => {
                    const entries = Object.values(byProdukJadwal)
                        .filter(e => e.product_type === pt)
                        .sort((a, b) => mealOrder[a.meal_time] - mealOrder[b.meal_time]);
                    if (entries.length === 0) return;
                    text += `\n*${namaProdukTampilan[pt]}*\n`;
                    entries.forEach(e => {
                        text += `- ${namaMeal[e.meal_time]}: Diproduksi ${e.produksi} porsi | Terkirim ${e.terkirim} porsi\n`;
                    });
                });
            }

            const internalAwal = rows.filter(r => !r.is_mitra);
            const mitraAwal = rows.filter(r => r.is_mitra);

            text += `\n*Total Pengiriman:*\n`;
            text += `\n_Internal (Rute 1-4)_\n`;
            tulisTotalPengiriman(internalAwal);
            text += `\n_Mitra SM_\n`;
            tulisTotalPengiriman(mitraAwal);

            // ===== 3. Ringkasan =====
            text += `\n*Ringkasan:*\n`;
            text += `Total jadwal: ${totalItem}\n`;
            text += `Sudah produksi: ${sudahProduksi}/${totalItem}\n`;
            text += `Sudah dikirim: ${sudahKirim}/${totalItem}\n`;
            text += `Sudah disetujui: ${sudahApprove}/${totalItem}\n`;

            // ===== 4. Evaluasi Pekerjaan (dulu Catatan Admin, kondisional) =====
            const adaCatatan = rows.filter(r => r.catatan_admin);
            if (adaCatatan.length > 0) {
                text += `\n*⚠️ Evaluasi Pekerjaan (${adaCatatan.length}):*\n`;
                const byPersonil = {};
                const tanpaTag = [];
                adaCatatan.forEach(r => {
                    if (r.catatan_tag_nama) {
                        if (!byPersonil[r.catatan_tag_nama]) byPersonil[r.catatan_tag_nama] = [];
                        byPersonil[r.catatan_tag_nama].push(r);
                    } else {
                        tanpaTag.push(r);
                    }
                });
                Object.keys(byPersonil).sort().forEach(nama => {
                    text += `\n👤 *${nama}*\n`;
                    byPersonil[nama].forEach(r => {
                        text += `- *${r.location_nama}* (*${labelProdukJadwal(r)}*): ${r.catatan_admin}\n`;
                    });
                });
                if (tanpaTag.length > 0) {
                    text += `\n👤 *Umum (tanpa tag)*\n`;
                    tanpaTag.forEach(r => {
                        text += `- *${r.location_nama}* (*${labelProdukJadwal(r)}*): ${r.catatan_admin}\n`;
                    });
                }
            }

            // ===== 5. Anomali Qty Anggota (kondisional) =====
            const anomaliAnggota = rows.filter(r =>
                r.product_type === 'anggota' && r.qty_produced !== null && r.default_qty !== null && r.qty_produced !== r.default_qty
            );
            if (anomaliAnggota.length > 0) {
                text += `\n*🔍 Anomali Qty Anggota:*\n`;
                anomaliAnggota.forEach(r => {
                    text += `- *${r.location_nama}*: input ${r.qty_produced} porsi (biasanya ${r.default_qty})\n`;
                });
            }

            // ===== 6. Performa Pengiriman (dipadetin, 1 baris per rute/mitra) =====
            const internal = internalAwal;
            const mitraRows = mitraAwal;

            const byRuteInternal = {};
            internal.forEach(r => {
                if (!byRuteInternal[r.route_nama]) byRuteInternal[r.route_nama] = [];
                byRuteInternal[r.route_nama].push(r);
            });
            const byMitra = {};
            mitraRows.forEach(r => {
                if (!byMitra[r.route_nama]) byMitra[r.route_nama] = [];
                byMitra[r.route_nama].push(r);
            });

            text += `\n*🚚 Performa Pengiriman:*\n\n`;
            Object.keys(byRuteInternal).sort().forEach(rute => {
                const list = byRuteInternal[rute];
                const jmlLokasi = new Set(list.map(r => r.location_nama)).size;
                text += `*${rute}* (${jmlLokasi} lokasi): ${hitungSelesai(list)}/${list.length} selesai · retur ${hitungRetur(list)} porsi\n`;
            });
            text += `\n`;
            Object.keys(byMitra).sort().forEach(namaMitra => {
                const list = byMitra[namaMitra];
                const jmlLokasi = new Set(list.map(r => r.location_nama)).size;
                text += `*${namaMitra}* (${jmlLokasi} lokasi): ${hitungSelesai(list)}/${list.length} selesai · retur ${hitungRetur(list)} porsi\n`;
            });

            // ===== 7. Detail per Lokasi (grup Rute/Mitra + Kurir, sub-grup per Jadwal) =====
            text += `\n*Detail per Lokasi:*\n`;

            function tulisGrupRute(list, namaGrup) {
                if (list.length === 0) return;
                const kurirList = [...new Set(list.flatMap(r => r.delivered_by_list))];
                const judul = kurirList.length > 0 ? `${namaGrup} | ${kurirList.join(', ')}` : namaGrup;
                text += `\n── ${judul.toUpperCase()} ──\n`;

                ['pagi', 'siang', 'malam'].forEach(jt => {
                    const items = list.filter(r => r.meal_time === jt);
                    if (items.length === 0) return;
                    text += `\n*Makan ${namaMeal[jt]}*\n`;
                    items
                        .sort((a, b) => a.location_nama.localeCompare(b.location_nama))
                        .forEach(r => {
                            if (r.qty_produced === null) {
                                text += `- ${r.location_nama}: belum ada input produksi\n`;
                                return;
                            }
                            let statusText = 'siap kirim';
                            if (r.qty_received !== null) statusText = r.status === 'approved' ? 'selesai & disetujui' : 'sudah terkirim';
                            const returText = r.retur > 0 ? `, retur ${r.retur}` : '';
                            text += `- ${r.location_nama}: ${r.qty_produced} porsi (${statusText}${returText})\n`;
                        });
                });
            }

            Object.keys(byRuteInternal).sort().forEach(rute => tulisGrupRute(byRuteInternal[rute], rute));
            Object.keys(byMitra).sort().forEach(namaMitra => tulisGrupRute(byMitra[namaMitra], namaMitra));

            // ===== 7. Personil Hari Ini =====
            const produksiHariIni = [...new Set(rows.filter(r => r.input_by_nama).map(r => r.input_by_nama))].sort();
            const deliveryHariIni = [...new Set(rows.flatMap(r => r.delivered_by_list))].sort();
            const adminHariIni = [...new Set(rows.filter(r => r.approved_by_nama).map(r => r.approved_by_nama))].sort();

            text += `\n*👥 Personil Hari Ini:*\n`;
            text += `- Produksi: ${produksiHariIni.length > 0 ? produksiHariIni.map(n => `*${n}*`).join(', ') : '—'}\n`;
            text += `- Delivery: ${deliveryHariIni.length > 0 ? deliveryHariIni.map(n => `*${n}*`).join(', ') : '—'}\n`;
            text += `- Admin: ${adminHariIni.length > 0 ? adminHariIni.map(n => `*${n}*`).join(', ') : '—'}\n`;

            // ===== 8. Closing & Sign-off =====
            text += `\nTerima kasih atas kerja keras seluruh tim Produksi, Delivery, dan Mitra hari ini. Setiap porsi yang sampai dengan baik adalah hasil dari dedikasi kalian menjalankan tugas, sekecil apapun kelihatannya.\n`;
            text += `\nSalam hangat dari Dewan Direksi SM Group.\n`;
            text += `\n➖➖➖➖➖➖➖➖➖➖➖➖➖➖➖\n`;
            text += `Daily Report generated by *${currentProfile.nama}*\n`;
            text += `_${formatWaktuSekarangLengkap()}_`;

            output.value = text;
            statusLine.innerText = "Laporan berhasil disusun.";
        }

        function copyLaporan() {
            const area = document.getElementById('laporan-output');
            area.select();
            document.execCommand('copy');
            showPopup("Teks laporan disalin ke clipboard.");
        }

        async function loadLaporanBulanan() {
            const bulan = document.getElementById('month-picker-bulanan').value;
            const container = document.getElementById('bulanan-content');
            const statusLine = document.getElementById('status-line-bulanan');
            statusLine.innerText = "Memproses rekapitulasi...";
            container.innerHTML = `<div class="p-20 text-center"><div class="w-10 h-10 border-4 border-sm-gold border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>Memproses rekapitulasi ${bulan}...</div>`;

            const [y, m] = bulan.split('-').map(Number);
            const startDate = `${bulan}-01`;
            const lastDay = new Date(y, m, 0).getDate();
            const endDate = `${bulan}-${String(lastDay).padStart(2, '0')}`;

            const { data: pl, error } = await supabaseClient
                .from('production_logs')
                .select('id, product_type, qty_produced, locations(nama)')
                .gte('tanggal', startDate)
                .lte('tanggal', endDate);

            if (error) {
                container.innerHTML = `<div class="p-10 text-center text-error">Gagal memuat rekap: ${error.message}</div>`;
                statusLine.innerText = '';
                return;
            }

            if (!pl || pl.length === 0) {
                container.innerHTML = `<div class="bg-surface rounded-xl border border-outline-variant p-10 text-center italic text-outline">Belum ada data produksi untuk periode ${bulan}.</div>`;
                statusLine.innerText = '';
                return;
            }

            const logIds = pl.map(p => p.id);
            let dl = [];
            if (logIds.length > 0) {
                const { data: dls } = await supabaseClient
                    .from('delivery_logs')
                    .select('production_log_id, qty_received, retur')
                    .in('production_log_id', logIds);
                dl = dls || [];
            }
            const deliveryByLog = {};
            dl.forEach(d => {
                if (!deliveryByLog[d.production_log_id]) deliveryByLog[d.production_log_id] = [];
                deliveryByLog[d.production_log_id].push(d);
            });

            const agg = {};
            pl.forEach(row => {
                const key = `${row.locations.nama}|${row.product_type}`;
                if (!agg[key]) agg[key] = { location: row.locations.nama, product: row.product_type, qty_produced: 0, qty_received: 0, retur: 0 };
                agg[key].qty_produced += row.qty_produced;
                const ds = deliveryByLog[row.id] || [];
                ds.forEach(d => {
                    agg[key].qty_received += d.qty_received;
                    agg[key].retur += (d.retur || 0);
                });
            });

            const rows = Object.values(agg).sort((a, b) => a.location.localeCompare(b.location) || a.product.localeCompare(b.product));

            let html = `<div class="bg-surface rounded-xl border border-outline-variant shadow-lg overflow-hidden">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-surface-container-low border-b border-outline-variant">
                            <th class="p-4 font-label-sm text-outline uppercase tracking-widest text-xs">Lokasi</th>
                            <th class="p-4 font-label-sm text-outline uppercase tracking-widest text-xs">Produk</th>
                            <th class="p-4 font-label-sm text-outline uppercase tracking-widest text-xs">Total Produksi</th>
                            <th class="p-4 font-label-sm text-outline uppercase tracking-widest text-xs">Total Diterima</th>
                            <th class="p-4 font-label-sm text-outline uppercase tracking-widest text-xs">Total Retur</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-outline-variant">`;
            rows.forEach(r => {
                html += `<tr class="hover:bg-surface-container-low transition-colors">
                    <td class="p-4 font-bold text-primary">${r.location}</td>
                    <td class="p-4">${namaProduk[r.product]}</td>
                    <td class="p-4 font-bold">${r.qty_produced}</td>
                    <td class="p-4">${r.qty_received}</td>
                    <td class="p-4 ${r.retur > 0 ? 'text-error font-bold' : 'text-outline-variant'}">${r.retur}</td>
                </tr>`;
            });
            html += `</tbody></table></div>`;

            container.innerHTML = html;
            statusLine.innerText = `Rekap ${rows.length} baris untuk periode ${bulan}.`;
        }

    </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(console.error);
    });
  }
</script>
